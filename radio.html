<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.radio {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.radio-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* الشاشة */
.screen {
    position: absolute;
    width: 38%;
    height: 13%;
    left: 31%;
    top: 34%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
}

.number {
    font-family: monospace;
    font-size: clamp(45px, 12vw, 100px);
    font-weight: bold;
    color: #000;
}

/* الأزرار */
button {
    position: absolute;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 5;
}

/* + */
.plus {
    width: 12%;
    height: 6%;
    left: 30%;
    top: 50%;
}

/* M */
.mode {
    width: 12%;
    height: 6%;
    left: 44%;
    top: 50%;
}

/* - */
.minus {
    width: 12%;
    height: 6%;
    left: 58%;
    top: 50%;
}
</style>
</head>

<body>

<div class="radio">

    <!-- غيّر الاسم فقط إذا اسم الصورة مختلف -->
    <img src="radio.png" class="radio-img">

    <div class="screen">
        <div class="number" id="number">001</div>
    </div>

    <button class="plus" onclick="changeNumber(1)"></button>

    <button class="mode" onclick="modeChange()"></button>

    <button class="minus" onclick="changeNumber(-1)"></button>

</div>

<script>
let number = 1;

function showNumber() {
    document.getElementById("number").textContent =
        String(number).padStart(3, "0");
}

function changeNumber(value) {
    number += value;

    if (number > 999) number = 1;
    if (number < 1) number = 999;

    showNumber();
}

function modeChange() {
    number++;

    if (number > 999) {
        number = 1;
    }

    showNumber();
}

showNumber();
</script>

</body>
</html>
