<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>MECID Radio</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-x:hidden;
}

/* =========================
   الجهاز
========================= */

.radio{
    position:relative;

    /* حجم مناسب للموبايل */
    width:min(100vw,430px);

    aspect-ratio:691 / 1536;

    background-image:url("radio.jpg");
    background-size:100% 100%;
    background-repeat:no-repeat;

    user-select:none;
    flex-shrink:0;
}


/* =========================
   كل الأزرار
========================= */

.button{
    position:absolute;

    border:0;
    padding:0;

    background:transparent;

    cursor:pointer;

    z-index:20;

    touch-action:manipulation;

    -webkit-tap-highlight-color:transparent;
}

.button:active{
    transform:scale(.94);
}


/* =========================
   LOCAL
========================= */

.local{
    left:39%;
    top:21%;
    width:30%;
    height:5%;
}


/* =========================
   POWER
========================= */

.power{
    left:16.5%;
    top:24%;
    width:13%;
    height:7%;
}


/* =========================
   RP
========================= */

.rp{
    left:74%;
    top:24%;
    width:9%;
    height:6%;
}


/* =========================
   الأزرار الجانبية
========================= */

.lock{
    left:82%;
    top:35%;
    width:8%;
    height:5%;
}

.p-button{
    left:82%;
    top:39.5%;
    width:8%;
    height:5%;
}

.v-button{
    left:82%;
    top:44%;
    width:8%;
    height:5%;
}

.eye{
    left:82%;
    top:48%;
    width:8%;
    height:5%;
}


/* =========================
   + / M / -
========================= */

.plus{
    left:30%;
    top:47%;
    width:14%;
    height:5%;
}

.memory{
    left:50%;
    top:47%;
    width:12%;
    height:5%;
}

.minus{
    left:64%;
    top:47%;
    width:14%;
    height:5%;
}


/* =========================
   UP / SCAN / DN
========================= */

.up{
    left:27%;
    top:53%;
    width:15%;
    height:8%;
}

.scan{
    left:45%;
    top:53%;
    width:18%;
    height:8%;
}

.down{
    left:66%;
    top:53%;
    width:15%;
    height:8%;
}


/* =========================
   PTT
========================= */

.ptt{
    left:25%;
    top:65%;
    width:52%;
    height:15%;
}


/* =========================
   رقم القناة
========================= */

.channel{
    position:absolute;

    left:33.5%;
    top:36.5%;

    width:34%;
    height:8%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
        "Courier New",
        monospace;

    font-size:clamp(28px,8vw,58px);

    font-weight:900;

    color:#000;

    pointer-events:none;

    z-index:10;

    letter-spacing:3px;
}


/* =========================
   Connecting
========================= */

.connection{
    position:absolute;

    left:0;
    top:5%;

    width:100%;

    color:#ffd900;

    font-family:Arial,sans-serif;

    font-size:clamp(17px,4vw,28px);

    font-weight:bold;

    pointer-events:none;

    z-index:30;
}


/* =========================
   رسالة الحالة
========================= */

.status{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    padding:10px 18px;

    border-radius:20px;

    background:rgba(0,0,0,.9);

    color:#fff;

    font-family:Arial,sans-serif;

    font-size:15px;

    display:none;

    z-index:1000;

    white-space:nowrap;
}

.status.show{
    display:block;
}


/* =========================
   SCAN
========================= */

.scanning .channel{
    animation:scanFlash .25s infinite alternate;
}

@keyframes scanFlash{

    from{
        opacity:.35;
    }

    to{
        opacity:1;
    }

}


/* =========================
   الشاشات الصغيرة
========================= */

@media(max-width:360px){

    .radio{
        width:100vw;
    }

}


/* =========================
   منع تحديد الصورة
========================= */

img{
    pointer-events:none;
}

</style>

</head>


<body>


<div class="radio" id="radio">


    <!-- حالة الاتصال -->

    <div class="connection" id="connection">
        Connecting...
    </div>


    <!-- رقم القناة -->

    <div class="channel" id="channel">
        00
    </div>


    <!-- LOCAL -->

    <button
        class="button local"
        id="local"
        aria-label="LOCAL">
    </button>


    <!-- POWER -->

    <button
        class="button power"
        id="power"
        aria-label="Power">
    </button>


    <!-- RP -->

    <button
        class="button rp"
        id="rp"
        aria-label="RP">
    </button>


    <!-- LOCK -->

    <button
        class="button lock"
        id="lock"
        aria-label="Lock">
    </button>


    <!-- P -->

    <button
        class="button p-button"
        id="p"
        aria-label="P">
    </button>


    <!-- V -->

    <button
        class="button v-button"
        id="v"
        aria-label="V">
    </button>


    <!-- EYE -->

    <button
        class="button eye"
        id="eye"
        aria-label="Monitor">
    </button>


    <!-- PLUS -->

    <button
        class="button plus"
        id="plus"
        aria-label="Volume Up">
    </button>


    <!-- MEMORY -->

    <button
        class="button memory"
        id="memory"
        aria-label="Memory">
    </button>


    <!-- MINUS -->

    <button
        class="button minus"
        id="minus"
        aria-label="Volume Down">
    </button>


    <!-- UP -->

    <button
        class="button up"
        id="up"
        aria-label="UP">
    </button>


    <!-- SCAN -->

    <button
        class="button scan"
        id="scan"
        aria-label="SCAN">
    </button>


    <!-- DN -->

    <button
        class="button down"
        id="down"
        aria-label="DN">
    </button>


    <!-- PTT -->

    <button
        class="button ptt"
        id="ptt"
        aria-label="Push To Talk">
    </button>


</div>


<div
    class="status"
    id="status">
</div>


<script>

let channel = 0;

let volume = 5;

let powered = true;

let locked = false;

let scanning = false;

let scanTimer = null;


/* =========================
   تحديث القناة
========================= */

function updateChannel(){

    document.getElementById("channel")
        .textContent =
        String(channel).padStart(2,"0");

}


/* =========================
   رسالة
========================= */

function message(text){

    const status =
        document.getElementById("status");

    status.textContent = text;

    status.classList.add("show");

    clearTimeout(status.timer);

    status.timer = setTimeout(function(){

        status.classList.remove("show");

    },1000);

}


/* =========================
   UP
========================= */

document.getElementById("up")
.onclick = function(){

    if(!powered || locked) return;

    channel++;

    if(channel > 99){
        channel = 0;
    }

    updateChannel();

};


/* =========================
   DN
========================= */

document.getElementById("down")
.onclick = function(){

    if(!powered || locked) return;

    channel--;

    if(channel < 0){
        channel = 99;
    }

    updateChannel();

};


/* =========================
   SCAN
========================= */

document.getElementById("scan")
.onclick = function(){

    if(!powered || locked) return;


    if(scanning){

        stopScan();

        return;
    }


    scanning = true;


    document
        .getElementById("radio")
        .classList.add("scanning");


    scanTimer = setInterval(function(){

        channel++;

        if(channel > 99){
            channel = 0;
        }

        updateChannel();

    },400);

};


/* =========================
   إيقاف SCAN
========================= */

function stopScan(){

    scanning = false;

    clearInterval(scanTimer);

    scanTimer = null;

    document
        .getElementById("radio")
        .classList.remove("scanning");

}


/* =========================
   POWER
========================= */

document.getElementById("power")
.onclick = function(){

    powered = !powered;


    if(!powered){

        stopScan();

        document
            .getElementById("channel")
            .textContent = "--";

        message("Radio OFF");

    }else{

        updateChannel();

        message("Radio ON");

    }

};


/* =========================
   LOCK
========================= */

document.getElementById("lock")
.onclick = function(){

    locked = !locked;

    message(
        locked
        ? "LOCKED"
        : "UNLOCKED"
    );

};


/* =========================
   +
========================= */

document.getElementById("plus")
.onclick = function(){

    if(!powered || locked) return;

    volume++;

    if(volume > 10){
        volume = 10;
    }

    message("VOL " + volume);

};


/* =========================
   -
========================= */

document.getElementById("minus")
.onclick = function(){

    if(!powered || locked) return;

    volume--;

    if(volume < 0){
        volume = 0;
    }

    message("VOL " + volume);

};


/* =========================
   V
========================= */

document.getElementById("v")
.onclick = function(){

    if(!powered) return;

    message("VOL " + volume);

};


/* =========================
   M
========================= */

document.getElementById("memory")
.onclick = function(){

    if(!powered) return;

    message("MEMORY");

};


/* =========================
   P
========================= */

document.getElementById("p")
.onclick = function(){

    if(!powered) return;

    message("P");

};


/* =========================
   RP
========================= */

document.getElementById("rp")
.onclick = function(){

    if(!powered) return;

    message("RP");

};


/* =========================
   LOCAL
========================= */

document.getElementById("local")
.onclick = function(){

    if(!powered) return;

    message("LOCAL");

};


/* =========================
   EYE / MONITOR
========================= */

document.getElementById("eye")
.onclick = function(){

    if(!powered) return;

    message("MONITOR");

};


/* =========================
   PTT
========================= */

const ptt =
    document.getElementById("ptt");


function startPTT(){

    if(!powered || locked) return;

    message("🎙️ PTT ON");

}


function stopPTT(){

    if(!powered) return;

    message("PTT OFF");

}


ptt.addEventListener(
    "pointerdown",
    startPTT
);

ptt.addEventListener(
    "pointerup",
    stopPTT
);

ptt.addEventListener(
    "pointercancel",
    stopPTT
);

ptt.addEventListener(
    "pointerleave",
    stopPTT
);


/* =========================
   البداية
========================= */

updateChannel();


setTimeout(function(){

    document
        .getElementById("connection")
        .textContent = "Connected";

},1500);

</script>

</body>
</html>
