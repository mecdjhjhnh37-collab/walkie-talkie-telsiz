<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اللاسلكي</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radio {
            width: min(100vw, 600px);
            aspect-ratio: 1 / 1;

            object-fit: cover;

            display: block;
        }

    </style>

</head>

<body>

    <!-- صورة اللاسلكي -->
    <img
        class="radio"
        src="radio.jpg"
        alt="اللاسلكي"
    >

</body>

</html>
