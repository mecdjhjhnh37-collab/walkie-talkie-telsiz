<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>MECID RADIO</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow:hidden;
    font-family:Arial,sans-serif;
}


/* =====================================================
   الجهاز
===================================================== */

.radio{

    position:relative;

    width:min(88vw,390px);

    height:calc(min(88vw,390px) * 2.12);

    max-height:92vh;

    margin-top:18px;

    border-radius:55px 55px 38px 38px;

    background:
        linear-gradient(
            100deg,
            #101010 0%,
            #333 13%,
            #202020 32%,
            #111 70%,
            #303030 90%,
            #0b0b0b 100%
        );

    border:3px solid #444;

    box-shadow:
        0 20px 45px #000,
        inset 5px 0 10px rgba(255,255,255,.08),
        inset -7px 0 15px rgba(0,0,0,.8);

    direction:ltr;
}


/* =====================================================
   الهوائي
===================================================== */

.antenna{

    position:absolute;

    right:38px;
    top:-78px;

    width:48px;
    height:145px;

    border-radius:25px 25px 10px 10px;

    background:
        linear-gradient(
            90deg,
            #151515,
            #555,
            #202020,
            #111
        );

    transform:rotate(4deg);

    box-shadow:
        inset 5px 0 8px rgba(255,255,255,.12),
        8px 10px 15px #000;
}


/* =====================================================
   المقبض العلوي
===================================================== */

.knob{

    position:absolute;

    left:52px;
    top:-30px;

    width:62px;
    height:48px;

    border-radius:14px 14px 8px 8px;

    background:
        repeating-linear-gradient(
            90deg,
            #111 0px,
            #111 6px,
            #444 7px,
            #151515 11px
        );

    border:3px solid #222;

    box-shadow:
        0 7px 10px #000;
}


/* =====================================================
   Connecting
===================================================== */

.connection{

    position:absolute;

    left:-1px;
    top:-92px;

    color:#ffd900;

    font-size:24px;
    font-weight:bold;

    white-space:nowrap;
}


/* =====================================================
   Online
===================================================== */

.online{

    position:absolute;

    left:40px;
    top:-20px;

    color:#ffd900;

    font-size:20px;
    font-weight:bold;

    white-space:nowrap;

    display:none;
}


/* =====================================================
   LOCAL
===================================================== */

.local{

    position:absolute;

    left:50%;
    top:12px;

    transform:translateX(-50%);

    width:155px;
    height:42px;

    border-radius:25px;

    border:5px solid #555;

    background:
        linear-gradient(
            #75e46b,
            #16a80d
        );

    color:#fff;

    font-size:21px;
    font-weight:bold;

    text-shadow:0 2px 2px #155d11;

    box-shadow:
        inset 0 3px 5px rgba(255,255,255,.45),
        0 4px 8px #000;

    z-index:10;
}


/* =====================================================
   جسم الشاشة العلوي
===================================================== */

.display-body{

    position:absolute;

    top:65px;
    left:50%;

    transform:translateX(-50%);

    width:82%;
    height:355px;

    border-radius:105px 105px 40px 40px;

    background:
        radial-gradient(
            ellipse at center,
            #444 0%,
            #292929 48%,
            #111 75%
        );

    border:4px solid #080808;

    box-shadow:
        inset 0 0 0 3px #555,
        inset 0 -15px 25px #050505;
}


/* =====================================================
   زر Power
===================================================== */

.power{

    position:absolute;

    left:-25px;
    top:20px;

    width:68px;
    height:68px;

    border-radius:50%;

    border:5px solid #111;

    background:
        radial-gradient(
            circle,
            #63bfff,
            #167be4 55%,
            #102b55
        );

    color:#0b4e9c;

    font-size:38px;
    font-weight:bold;

    box-shadow:
        0 0 8px #38aaff,
        inset 0 3px 5px rgba(255,255,255,.6),
        0 5px 8px #000;

    z-index:30;
}


/* =====================================================
   RP
===================================================== */

.rp{

    position:absolute;

    right:-20px;
    top:27px;

    width:54px;
    height:54px;

    border-radius:50%;

    border:3px solid #111;

    background:
        radial-gradient(
            circle,
            #ff9b9b,
            #bb3636 65%,
            #551111
        );

    color:#fff;

    font-weight:bold;
    font-size:17px;

    box-shadow:0 4px 7px #000;

    z-index:30;
}


/* =====================================================
   أيقونة القائمة
===================================================== */

.menu-icon{

    position:absolute;

    top:83px;
    left:50%;

    transform:translateX(-50%);

    color:#fff;

    font-size:38px;

    z-index:5;
}


/* =====================================================
   إطار الشاشة
===================================================== */

.screen-frame{

    position:absolute;

    left:50%;
    top:126px;

    transform:translateX(-50%);

    width:74%;
    height:145px;

    padding:9px;

    border-radius:23px;

    background:#242424;

    border:4px solid #111;

    box-shadow:
        inset 0 0 0 2px #555,
        0 7px 12px #000;
}


/* =====================================================
   الشاشة
===================================================== */

.screen{

    width:100%;
    height:100%;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #ffc43c,
            #ff9900
        );

    border:3px solid #734500;

    position:relative;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    box-shadow:
        inset 0 0 18px rgba(255,255,255,.35);
}


/* لمعان الشاشة */

.screen::after{

    content:"";

    position:absolute;

    width:150%;
    height:35px;

    top:35px;
    left:-25%;

    background:rgba(255,255,255,.12);

    transform:rotate(-12deg);

}


/* الرقم */

.channel{

    position:relative;

    z-index:5;

    color:#050505;

    font-family:
        "Courier New",
        monospace;

    font-size:58px;

    font-weight:900;

    letter-spacing:2px;

    line-height:1;
}


/* رقم صغير فوق الشاشة */

.small-number{

    position:absolute;

    top:8px;

    left:50%;

    transform:translateX(-50%);

    font-family:monospace;

    font-size:12px;

    font-weight:bold;

    z-index:10;
}


/* =====================================================
   أزرار + M -
===================================================== */

.middle-controls{

    position:absolute;

    left:50%;

    top:278px;

    transform:translateX(-50%);

    width:82%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    direction:ltr;

    z-index:20;
}


.middle-button{

    height:47px;

    border-radius:18px;

    border:3px solid #222;

    background:
        linear-gradient(
            #eee,
            #aaa
        );

    color:#111;

    font-size:22px;

    font-weight:bold;

    box-shadow:
        0 5px 0 #111,
        0 7px 10px #000;
}


.plus,
.minus{

    width:85px;
}


.memory{

    width:68px;
}


.middle-button:active{

    transform:translateY(4px);

    box-shadow:
        0 1px 0 #111;
}


/* =====================================================
   أزرار UP SCAN DN
===================================================== */

.main-controls{

    position:absolute;

    top:365px;

    left:50%;

    transform:translateX(-50%);

    width:82%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    direction:ltr;

    z-index:20;
}


.main-button{

    height:82px;

    border-radius:27px;

    border:4px solid #222;

    background:
        linear-gradient(
            145deg,
            #fff,
            #c8c8c8
        );

    color:#111;

    font-size:20px;

    font-weight:bold;

    box-shadow:
        0 6px 0 #333,
        0 8px 12px #000;
}


.up,
.down{

    width:75px;

    transform:rotate(-14deg);
}


.down{

    transform:rotate(14deg);
}


.scan{

    width:105px;

    height:66px;

    border-radius:25px;

    transform:none;
}


.main-button:active{

    transform:translateY(5px);
}


/* =====================================================
   السماعة
===================================================== */

.speaker{

    position:absolute;

    left:50%;

    top:470px;

    transform:translateX(-50%);

    width:80%;

    height:360px;

    border-radius:65px 65px 90px 90px;

    background:
        linear-gradient(
            145deg,
            #333,
            #111
        );

    border:4px solid #555;

    box-shadow:
        inset 0 5px 12px rgba(255,255,255,.06),
        inset 0 -15px 25px #000,
        0 8px 15px #000;

    padding:40px 35px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    grid-auto-rows:15px;

    gap:17px;

    align-content:start;
}


/* ثقوب السماعة */

.hole{

    height:9px;

    border-radius:10px;

    background:#030303;

    box-shadow:
        inset 0 2px 2px #555,
        0 1px 2px #000;
}


/* =====================================================
   PTT
===================================================== */

.ptt{

    position:absolute;

    left:50%;
    top:625px;

    transform:translateX(-50%);

    border:0;

    background:transparent;

    color:#fff;

    font-size:30px;

    font-weight:bold;

    text-shadow:
        0 2px 4px #000;

    z-index:30;
}


/* =====================================================
   الأزرار الجانبية
===================================================== */

.side-controls{

    position:absolute;

    right:-28px;

    top:175px;

    display:flex;

    flex-direction:column;

    gap:10px;

    z-index:30;
}


.side-button{

    width:53px;
    height:53px;

    border-radius:50%;

    border:3px solid #222;

    background:
        linear-gradient(
            #eee,
            #999
        );

    color:#111;

    font-size:22px;
    font-weight:bold;

    box-shadow:
        0 4px 7px #000,
        inset 0 2px 3px #fff;
}


.side-button:active{

    transform:scale(.93);

}


/* =====================================================
   زر القفل
===================================================== */

.lock{

    font-size:20px;

}


/* =====================================================
   الحالة
===================================================== */

.status{

    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.9);

    color:#fff;

    padding:10px 20px;

    border-radius:25px;

    font-size:15px;

    display:none;

    z-index:100;
}


.status.show{

    display:block;
}


/* =====================================================
   SCAN
===================================================== */

.scanning .screen{

    animation:flash .25s infinite alternate;
}


@keyframes flash{

    from{
        filter:brightness(.8);
    }

    to{
        filter:brightness(1.3);
    }

}


/* =====================================================
   M
===================================================== */

.auto .channel{

    animation:numberFlash .12s infinite alternate;
}


@keyframes numberFlash{

    from{
        opacity:.55;
    }

    to{
        opacity:1;
    }

}


/* =====================================================
   الهاتف الصغير
===================================================== */

@media(max-height:700px){

    .radio{
        transform:scale(.78);
        transform-origin:top center;
    }

}

</style>

</head>


<body>


<div class="radio" id="radio">


    <div class="antenna"></div>

    <div class="knob"></div>


    <div class="connection" id="connection">
        Connecting...
    </div>


    <div class="local" id="local">
        LOCAL
    </div>


    <div class="display-body">


        <button
            class="power"
            id="power">
            ⏻
        </button>


        <button
            class="rp"
            id="rp">
            RP
        </button>


        <div class="menu-icon">
            ▤
        </div>


        <!-- الشاشة -->

        <div class="screen-frame">

            <div class="screen">

                <div
                    class="small-number"
                    id="smallNumber">
                    001
                </div>

                <div
                    class="channel"
                    id="channel">
                    001
                </div>

            </div>

        </div>


        <!-- + M - -->

        <div class="middle-controls">

            <button
                class="middle-button plus"
                id="plus">
                +
            </button>

            <button
                class="middle-button memory"
                id="memory">
                M
            </button>

            <button
                class="middle-button minus"
                id="minus">
                -
            </button>

        </div>


        <!-- UP SCAN DN -->

        <div class="main-controls">

            <button
                class="main-button up"
                id="up">
                UP
            </button>

            <button
                class="main-button scan"
                id="scan">
                SCAN
            </button>

            <button
                class="main-button down"
                id="down">
                DN
            </button>

        </div>


        <!-- السماعة -->

        <div class="speaker">

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>
            <span class="hole"></span>

        </div>


        <button
            class="ptt"
            id="ptt">
            PTT
        </button>


        <!-- الأزرار الجانبية -->

        <div class="side-controls">

            <button
                class="side-button lock"
                id="lock">
                🔒
            </button>

            <button
                class="side-button"
                id="p">
                P
            </button>

            <button
                class="side-button"
                id="v">
                V
            </button>

            <button
                class="side-button"
                id="eye">
                ◉
            </button>

        </div>

    </div>

</div>


<div
    class="status"
    id="status">
</div>


<script>

/* =========================================
   المتغيرات
========================================= */

let channel = 1;

let volume = 5;

let powered = true;

let locked = false;

let autoM = false;

let scanning = false;

let mTimer = null;

let scanTimer = null;


/* =========================================
   العناصر
========================================= */

const radio =
    document.getElementById("radio");

const channelEl =
    document.getElementById("channel");

const smallNumber =
    document.getElementById("smallNumber");

const status =
    document.getElementById("status");


/* =========================================
   تحديث الرقم
========================================= */

function updateChannel(){

    const number =
        String(channel).padStart(3,"0");

    channelEl.textContent = number;

    smallNumber.textContent = number;

}


/* =========================================
   رسالة
========================================= */

function message(text){

    status.textContent = text;

    status.classList.add("show");

    clearTimeout(status.timer);

    status.timer = setTimeout(() => {

        status.classList.remove("show");

    },1000);

}


/* =========================================
   إيقاف M
========================================= */

function stopM(){

    autoM = false;

    clearInterval(mTimer);

    mTimer = null;

    radio.classList.remove("auto");

}


/* =========================================
   زر M
   001 → 002 → ... → 999
========================================= */

document
.getElementById("memory")
.addEventListener("click",function(){

    if(!powered || locked){
        return;
    }

    if(autoM){

        stopM();

        message("M STOP");

        return;
    }


    autoM = true;

    radio.classList.add("auto");

    message("M AUTO");


    mTimer = setInterval(function(){

        channel++;

        if(channel > 999){
            channel = 1;
        }

        updateChannel();

    },180);

});


/* =========================================
   +
========================================= */

document
.getElementById("plus")
.addEventListener("click",function(){

    if(!powered || locked){
        return;
    }

    stopM();

    channel++;

    if(channel > 999){
        channel = 1;
    }

    updateChannel();

});


/* =========================================
   -
========================================= */

document
.getElementById("minus")
.addEventListener("click",function(){

    if(!powered || locked){
        return;
    }

    stopM();

    channel--;

    if(channel < 1){
        channel = 999;
    }

    updateChannel();

});


/* =========================================
   UP
========================================= */

document
.getElementById("up")
.addEventListener("click",function(){

    if(!powered || locked){
        return;
    }

    stopM();

    channel++;

    if(channel > 999){
        channel = 1;
    }

    updateChannel();

});


/* =========================================
   DN
========================================= */

document
.getElementById("down")
.addEventListener("click",function(){

    if(!powered || locked){
        return;
    }

    stopM();

    channel--;

    if(channel < 1){
        channel = 999;
    }

    updateChannel();

});


/* =========================================
   SCAN
========================================= */

document
.getElementById("scan")
.addEventListener("click",function(){

    if(!powered || locked){
        return;
    }

    stopM();

    if(scanning){

        clearInterval(scanTimer);

        scanning = false;

        radio.classList.remove("scanning");

        message("SCAN STOP");

        return;
    }


    scanning = true;

    radio.classList.add("scanning");

    message("SCANNING");


    scanTimer = setInterval(function(){

        channel++;

        if(channel > 999){
            channel = 1;
        }

        updateChannel();

    },300);

});


/* =========================================
   POWER
========================================= */

document
.getElementById("power")
.addEventListener("click",function(){

    powered = !powered;


    if(!powered){

        stopM();

        clearInterval(scanTimer);

        scanning = false;

        radio.classList.remove("scanning");

        channelEl.textContent = "---";

        smallNumber.textContent = "---";

        message("RADIO OFF");

    }else{

        updateChannel();

        message("RADIO ON");

    }

});


/* =========================================
   LOCK
========================================= */

document
.getElementById("lock")
.addEventListener("click",function(){

    locked = !locked;

    message(
        locked
        ? "LOCKED"
        : "UNLOCKED"
    );

});


/* =========================================
   LOCAL
========================================= */

document
.getElementById("local")
.addEventListener("click",function(){

    if(!powered){
        return;
    }

    message("LOCAL");

});


/* =========================================
   RP
========================================= */

document
.getElementById("rp")
.addEventListener("click",function(){

    if(!powered){
        return;
    }

    message("RP");

});


/* =========================================
   P
========================================= */

document
.getElementById("p")
.addEventListener("click",function(){

    if(!powered){
        return;
    }

    message("P");

});


/* =========================================
   V
========================================= */

document
.getElementById("v")
.addEventListener("click",function(){

    if(!powered){
        return;
    }

    message("VOL " + volume);

});


/* =========================================
   EYE
========================================= */

document
.getElementById("eye")
.addEventListener("click",function(){

    if(!powered){
        return;
    }

    message("MONITOR");

});


/* =========================================
   PTT
========================================= */

const ptt =
    document.getElementById("ptt");


ptt.addEventListener(
    "pointerdown",
    function(){

        if(!powered || locked){
            return;
        }

        message("🎙️ PTT ON");

    }
);


ptt.addEventListener(
    "pointerup",
    function(){

        if(!powered){
            return;
        }

        message("PTT OFF");

    }
);


ptt.addEventListener(
    "pointercancel",
    function(){

        message("PTT OFF");

    }
);


/* =========================================
   بدء التشغيل
========================================= */

updateChannel();


setTimeout(function(){

    document
    .getElementById("connection")
    .textContent = "Connected";

},1500);

</script>

</body>
</html>
