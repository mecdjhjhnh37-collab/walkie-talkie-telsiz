<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>MECID Radio</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-x:hidden;
}


/* =========================================
   الجهاز
========================================= */

.radio{

    position:relative;

    width:min(92vw,430px);

    aspect-ratio:691 / 1536;

    margin:0 auto;

    background-image:url("radio.jpg");

    background-size:100% 100%;

    background-repeat:no-repeat;

    user-select:none;

    touch-action:manipulation;
}


/* =========================================
   الأزرار الشفافة فوق الصورة
========================================= */

.button{

    position:absolute;

    border:0;

    background:transparent;

    padding:0;

    margin:0;

    cursor:pointer;

    z-index:30;

    outline:none;

    touch-action:manipulation;

    -webkit-tap-highlight-color:transparent;
}


.button:active{

    transform:scale(.94);

}


/* =========================================
   LOCAL
========================================= */

.local{

    left:39%;
    top:21%;

    width:30%;
    height:5%;
}


/* =========================================
   POWER
========================================= */

.power{

    left:16%;
    top:24%;

    width:14%;
    height:7%;
}


/* =========================================
   RP
========================================= */

.rp{

    left:74%;
    top:24%;

    width:10%;
    height:6%;
}


/* =========================================
   LOCK
========================================= */

.lock{

    left:81%;
    top:35%;

    width:10%;
    height:5%;
}


/* =========================================
   P
========================================= */

.p-button{

    left:81%;
    top:39.5%;

    width:10%;
    height:5%;
}


/* =========================================
   V
========================================= */

.v-button{

    left:81%;
    top:44%;

    width:10%;
    height:5%;
}


/* =========================================
   EYE
========================================= */

.eye{

    left:81%;
    top:48%;

    width:10%;
    height:5%;
}


/* =========================================
   +
========================================= */

.plus{

    left:29%;
    top:47%;

    width:15%;
    height:5%;
}


/* =========================================
   M
========================================= */

.memory{

    left:49%;
    top:47%;

    width:13%;
    height:5%;
}


/* =========================================
   -
========================================= */

.minus{

    left:64%;
    top:47%;

    width:15%;
    height:5%;
}


/* =========================================
   UP
========================================= */

.up{

    left:26%;
    top:53%;

    width:16%;
    height:8%;
}


/* =========================================
   SCAN
========================================= */

.scan{

    left:45%;
    top:53%;

    width:19%;
    height:8%;
}


/* =========================================
   DN
========================================= */

.down{

    left:66%;
    top:53%;

    width:16%;
    height:8%;
}


/* =========================================
   PTT
========================================= */

.ptt{

    left:25%;
    top:65%;

    width:52%;
    height:15%;
}


/* =========================================
   رقم الموجة
========================================= */

.channel{

    position:absolute;

    left:34%;

    top:36.2%;

    width:32%;

    height:8%;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#000;

    font-family:
        "Courier New",
        monospace;

    font-size:clamp(
        30px,
        11vw,
        58px
    );

    font-weight:900;

    letter-spacing:2px;

    line-height:1;

    pointer-events:none;

    z-index:20;

    text-align:center;

    direction:ltr;

}


/* =========================================
   Connecting
========================================= */

.connection{

    position:absolute;

    left:0;

    top:5%;

    width:100%;

    color:#ffd900;

    font-family:Arial,sans-serif;

    font-size:clamp(
        18px,
        5vw,
        30px
    );

    font-weight:bold;

    direction:ltr;

    text-align:left;

    padding-left:2px;

    pointer-events:none;

    z-index:40;
}


/* =========================================
   Online Users
========================================= */

.online{

    position:absolute;

    left:14%;

    top:14%;

    color:#ffd900;

    font-family:Arial,sans-serif;

    font-size:clamp(
        15px,
        4vw,
        24px
    );

    font-weight:bold;

    direction:ltr;

    pointer-events:none;

    z-index:40;
}


/* =========================================
   رسالة الحالة
========================================= */

.status{

    position:fixed;

    left:50%;

    bottom:20px;

    transform:translateX(-50%);

    padding:10px 20px;

    border-radius:20px;

    background:rgba(0,0,0,.9);

    color:white;

    font-family:Arial,sans-serif;

    font-size:15px;

    white-space:nowrap;

    display:none;

    z-index:100;
}

.status.show{

    display:block;
}


/* =========================================
   وضع SCAN
========================================= */

.scanning .channel{

    animation:
        scanFlash .25s infinite alternate;
}


@keyframes scanFlash{

    from{
        opacity:.35;
    }

    to{
        opacity:1;
    }

}


/* =========================================
   وضع M
========================================= */

.m-active .channel{

    animation:
        numberFlash .12s infinite alternate;
}


@keyframes numberFlash{

    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }

}


/* =========================================
   الشاشة مطفأة
========================================= */

.radio.off .channel{

    opacity:.15;
}


/* =========================================
   شاشات صغيرة
========================================= */

@media(max-width:360px){

    .radio{

        width:94vw;

    }

    .channel{

        font-size:10vw;

    }

}

</style>

</head>


<body>


<div
    class="radio"
    id="radio">


    <!-- =================================
         Connecting
    ================================= -->

    <div
        class="connection"
        id="connection">

        Connecting...

    </div>


    <!-- =================================
         Online Users
    ================================= -->

    <div
        class="online"
        id="online">

        Online Users=1

    </div>


    <!-- =================================
         رقم الموجة
    ================================= -->

    <div
        class="channel"
        id="channel">

        001

    </div>


    <!-- =================================
         LOCAL
    ================================= -->

    <button
        class="button local"
        id="local"
        aria-label="LOCAL">
    </button>


    <!-- =================================
         POWER
    ================================= -->

    <button
        class="button power"
        id="power"
        aria-label="Power">
    </button>


    <!-- =================================
         RP
    ================================= -->

    <button
        class="button rp"
        id="rp"
        aria-label="RP">
    </button>


    <!-- =================================
         LOCK
    ================================= -->

    <button
        class="button lock"
        id="lock"
        aria-label="Lock">
    </button>


    <!-- =================================
         P
    ================================= -->

    <button
        class="button p-button"
        id="p"
        aria-label="P">
    </button>


    <!-- =================================
         V
    ================================= -->

    <button
        class="button v-button"
        id="v"
        aria-label="V">
    </button>


    <!-- =================================
         EYE
    ================================= -->

    <button
        class="button eye"
        id="eye"
        aria-label="Monitor">
    </button>


    <!-- =================================
         +
    ================================= -->

    <button
        class="button plus"
        id="plus"
        aria-label="Plus">
    </button>


    <!-- =================================
         M
    ================================= -->

    <button
        class="button memory"
        id="memory"
        aria-label="Memory">
    </button>


    <!-- =================================
         -
    ================================= -->

    <button
        class="button minus"
        id="minus"
        aria-label="Minus">
    </button>


    <!-- =================================
         UP
    ================================= -->

    <button
        class="button up"
        id="up"
        aria-label="UP">
    </button>


    <!-- =================================
         SCAN
    ================================= -->

    <button
        class="button scan"
        id="scan"
        aria-label="SCAN">
    </button>


    <!-- =================================
         DN
    ================================= -->

    <button
        class="button down"
        id="down"
        aria-label="DN">
    </button>


    <!-- =================================
         PTT
    ================================= -->

    <button
        class="button ptt"
        id="ptt"
        aria-label="Push To Talk">
    </button>


</div>


<!-- رسالة -->

<div
    class="status"
    id="status">
</div>


<script>

/* =========================================
   المتغيرات
========================================= */

let channel = 1;

let volume = 5;

let powered = true;

let locked = false;

let scanning = false;

let mRunning = false;

let scanTimer = null;

let mTimer = null;


/* =========================================
   عناصر الصفحة
========================================= */

const radio =
    document.getElementById("radio");

const channelElement =
    document.getElementById("channel");

const status =
    document.getElementById("status");


/* =========================================
   تحديث رقم الموجة
========================================= */

function updateChannel(){

    channelElement.textContent =
        String(channel).padStart(3,"0");

}


/* =========================================
   الرسائل
========================================= */

function message(text){

    status.textContent = text;

    status.classList.add("show");

    clearTimeout(status.timer);

    status.timer = setTimeout(() => {

        status.classList.remove("show");

    },1200);

}


/* =========================================
   إيقاف M
========================================= */

function stopM(){

    mRunning = false;

    clearInterval(mTimer);

    mTimer = null;

    radio.classList.remove("m-active");

}


/* =========================================
   تشغيل M
========================================= */

function startM(){

    if(!powered || locked){

        return;

    }

    stopScan();

    mRunning = true;

    radio.classList.add("m-active");

    /*
       يبدأ من 001
       ويستمر حتى 999
       ثم يرجع 001
    */

    mTimer = setInterval(() => {

        channel++;

        if(channel > 999){

            channel = 1;

        }

        updateChannel();

    },150);

}


/* =========================================
   زر M
========================================= */

document
.getElementById("memory")
.addEventListener("click",function(){

    if(!powered || locked){

        return;

    }

    if(mRunning){

        stopM();

        message("M STOP");

    }else{

        startM();

        message("M AUTO");

    }

});


/* =========================================
   +
========================================= */

document
.getElementById("plus")
.addEventListener("click",function(){

    if(!powered || locked){

        return;

    }

    stopM();

    channel++;

    if(channel > 999){

        channel = 1;

    }

    updateChannel();

});


/* =========================================
   -
========================================= */

document
.getElementById("minus")
.addEventListener("click",function(){

    if(!powered || locked){

        return;

    }

    stopM();

    channel--;

    if(channel < 1){

        channel = 999;

    }

    updateChannel();

});


/* =========================================
   UP
========================================= */

document
.getElementById("up")
.addEventListener("click",function(){

    if(!powered || locked){

        return;

    }

    stopM();

    channel++;

    if(channel > 999){

        channel = 1;

    }

    updateChannel();

});


/* =========================================
   DN
========================================= */

document
.getElementById("down")
.addEventListener("click",function(){

    if(!powered || locked){

        return;

    }

    stopM();

    channel--;

    if(channel < 1){

        channel = 999;

    }

    updateChannel();

});


/* =========================================
   SCAN
========================================= */

document
.getElementById("scan")
.addEventListener("click",function(){

    if(!powered || locked){

        return;

    }

    stopM();

    if(scanning){

        stopScan();

        message("SCAN STOP");

        return;

    }

    scanning = true;

    radio.classList.add("scanning");

    scanTimer = setInterval(() => {

        channel++;

        if(channel > 999){

            channel = 1;

        }

        updateChannel();

    },300);

    message("SCANNING");

});


/* =========================================
   إيقاف SCAN
========================================= */

function stopScan(){

    scanning = false;

    clearInterval(scanTimer);

    scanTimer = null;

    radio.classList.remove("scanning");

}


/* =========================================
   POWER
========================================= */

document
.getElementById("power")
.addEventListener("click",function(){

    powered = !powered;

    if(!powered){

        stopM();

        stopScan();

        radio.classList.add("off");

        channelElement.textContent = "---";

        message("RADIO OFF");

    }else{

        radio.classList.remove("off");

        updateChannel();

        message("RADIO ON");

    }

});


/* =========================================
   LOCK
========================================= */

document
.getElementById("lock")
.addEventListener("click",function(){

    locked = !locked;

    message(
        locked
        ? "LOCKED"
        : "UNLOCKED"
    );

});


/* =========================================
   LOCAL
========================================= */

document
.getElementById("local")
.addEventListener("click",function(){

    if(!powered){

        return;

    }

    message("LOCAL");

});


/* =========================================
   RP
========================================= */

document
.getElementById("rp")
.addEventListener("click",function(){

    if(!powered){

        return;

    }

    message("RP");

});


/* =========================================
   P
========================================= */

document
.getElementById("p")
.addEventListener("click",function(){

    if(!powered){

        return;

    }

    message("P");

});


/* =========================================
   V
========================================= */

document
.getElementById("v")
.addEventListener("click",function(){

    if(!powered){

        return;

    }

    message("VOL " + volume);

});


/* =========================================
   EYE
========================================= */

document
.getElementById("eye")
.addEventListener("click",function(){

    if(!powered){

        return;

    }

    message("MONITOR");

});


/* =========================================
   PTT
========================================= */

const ptt =
    document.getElementById("ptt");


function pttStart(){

    if(!powered || locked){

        return;

    }

    message("🎙️ PTT ON");

}


function pttStop(){

    if(!powered){

        return;

    }

    message("PTT OFF");

}


ptt.addEventListener(
    "pointerdown",
    pttStart
);

ptt.addEventListener(
    "pointerup",
    pttStop
);

ptt.addEventListener(
    "pointercancel",
    pttStop
);

ptt.addEventListener(
    "pointerleave",
    pttStop
);


/* =========================================
   الاتصال
========================================= */

setTimeout(() => {

    document
        .getElementById("connection")
        .textContent = "Connected";

},1500);


/* =========================================
   البداية
========================================= */

updateChannel();

</script>

</body>
</html>
