<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.radio {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.radio-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* منطقة شاشة الراديو */
.screen {
    position: absolute;

    /* مكان الشاشة */
    left: 31%;
    top: 39.8%;
    width: 38%;
    height: 11.5%;

    display: flex;
    justify-content: center;
    align-items: center;

    pointer-events: none;
    z-index: 10;
}

/* إخفاء الرقم الأصلي الموجود بالصورة */
.screen::before {
    content: "";
    position: absolute;

    width: 43%;
    height: 58%;

    left: 28.5%;
    top: 20%;

    background: #08f31c;
    border-radius: 5px;

    z-index: 1;
}

/* الرقم الجديد */
.number {
    position: relative;
    z-index: 2;

    font-family: "Courier New", monospace;
    font-size: clamp(45px, 10vw, 90px);
    font-weight: bold;
    line-height: 1;

    color: #000;

    letter-spacing: -4px;
}

/* الأزرار */
button {
    position: absolute;
    border: none;
    background: transparent;
    cursor: pointer;
    z-index: 20;
}

/* زر + */
.plus {
    width: 12%;
    height: 6%;
    left: 30%;
    top: 52%;
}

/* زر M */
.mode {
    width: 12%;
    height: 6%;
    left: 44%;
    top: 52%;
}

/* زر - */
.minus {
    width: 12%;
    height: 6%;
    left: 58%;
    top: 52%;
}
</style>
</head>

<body>

<div class="radio">

    <!-- صورة الراديو -->
    <img src="radio.png" class="radio-img">

    <!-- الرقم داخل الشاشة -->
    <div class="screen">
        <div class="number" id="number">001</div>
    </div>

    <!-- الأزرار -->
    <button class="plus" onclick="changeNumber(1)"></button>

    <button class="mode" onclick="changeNumber(1)"></button>

    <button class="minus" onclick="changeNumber(-1)"></button>

</div>

<script>

let number = 1;

function showNumber() {
    document.getElementById("number").textContent =
        String(number).padStart(3, "0");
}

function changeNumber(value) {

    number += value;

    if (number > 999) {
        number = 1;
    }

    if (number < 1) {
        number = 999;
    }

    showNumber();
}

showNumber();

</script>

</body>
</html>
