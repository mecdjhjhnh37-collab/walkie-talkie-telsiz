<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Professional Radio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050609;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* جسم الراديو */
.radio{
    position:relative;
    width:min(92vw,430px);
    height:96vh;
    max-height:850px;

    background:
        linear-gradient(90deg,
        #111317 0%,
        #292c2f 15%,
        #383b3e 50%,
        #292c2f 85%,
        #111317 100%);

    border-radius:48px 48px 30px 30px;

    border:2px solid #4b4e52;

    box-shadow:
        inset 0 0 35px #000,
        0 20px 50px #000;

    overflow:hidden;
}

/* الهوائي */
.antenna{
    position:absolute;
    top:-3%;
    right:15%;
    width:19%;
    height:18%;

    background:linear-gradient(90deg,#25282a,#686b6e,#222426);
    border-radius:30px 30px 12px 12px;

    box-shadow:inset -5px 0 8px #111;
}

/* المقبض */
.knob{
    position:absolute;
    top:3%;
    left:10%;
    width:20%;
    height:9%;

    background:
        repeating-linear-gradient(
            90deg,
            #151719 0px,
            #151719 7px,
            #44474a 8px,
            #111 10px
        );

    border-radius:16px;
    border:2px solid #555;
    box-shadow:inset 0 0 12px #000;
}

/* زر التشغيل */
.power{
    position:absolute;
    top:15%;
    left:8%;

    width:18%;
    aspect-ratio:1;

    border-radius:50%;
    border:4px solid #101214;

    background:radial-gradient(circle,#72c8ff,#1673d8 55%,#061b42);

    color:white;
    font-size:32px;

    box-shadow:
        0 0 10px #168cff,
        inset 0 0 12px #8ed8ff;

    z-index:5;
}

/* LOCAL */
.local{
    position:absolute;
    top:13%;
    left:31%;
    width:39%;
    height:6%;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:30px;

    background:linear-gradient(#76ff75,#079b19);

    border:5px solid #222;
    box-shadow:
        inset 0 2px 5px #baffb8,
        0 2px 5px #000;

    color:white;
    font-size:20px;
    font-weight:bold;
}

/* RP */
.rp{
    position:absolute;
    top:16%;
    right:9%;

    color:#eee;
    font-size:18px;
    font-weight:bold;
}

/* لوحة الشاشة */
.panel{
    position:absolute;
    top:22%;
    left:7%;
    width:86%;
    height:38%;

    background:linear-gradient(#303336,#17191b);

    border-radius:40px;

    border:3px solid #0b0c0e;

    box-shadow:
        inset 0 0 20px #000,
        0 5px 15px #000;
}

/* أيقونة */
.icon{
    text-align:center;
    margin-top:5%;

    color:#eee;
    font-size:38px;
}

/* الشاشة */
.display{
    position:absolute;
    top:22%;
    left:10%;
    width:80%;
    height:38%;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #0cff23,
            #00d916 55%,
            #06f52a
        );

    border:7px solid #25282a;

    box-shadow:
        inset 0 0 15px #006b0b,
        0 0 3px #000;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/* كتابة صغيرة */
.display::before{
    content:"020d8";
    position:absolute;
    top:7px;
    font-size:13px;
    font-weight:bold;
    color:#064f0d;
}

/* الرقم */
.number{
    font-family:"Courier New",monospace;
    font-size:clamp(55px,14vw,95px);
    font-weight:900;
    color:#050505;

    letter-spacing:-7px;

    margin-top:10px;
}

/* الأزرار */
.controls{
    position:absolute;
    bottom:8%;
    left:7%;
    width:86%;
    display:flex;
    justify-content:space-between;
}

.control{
    width:27%;
    height:55px;

    border-radius:18px;

    border:3px solid #111;

    background:
        linear-gradient(#fff,#d7d7d7);

    color:#111;

    font-size:25px;
    font-weight:bold;

    box-shadow:
        inset 0 2px 3px #fff,
        0 4px 5px #000;

    cursor:pointer;
}

.control:active{
    transform:translateY(3px);
    background:#aaa;
}

/* أزرار UP SCAN DN */
.bottom{
    position:absolute;
    top:64%;
    left:9%;
    width:82%;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.big{
    width:25%;
    height:75px;

    border-radius:30px;

    border:4px solid #161719;

    background:linear-gradient(#fff,#cfcfcf);

    font-size:20px;
    font-weight:bold;

    box-shadow:
        inset 0 2px 4px white,
        0 5px 8px #000;
}

.scan{
    width:32%;
    height:65px;

    border-radius:25px;

    border:4px solid #111;

    background:linear-gradient(#fff,#d0d0d0);

    font-size:20px;
    font-weight:bold;

    box-shadow:0 5px 8px #000;
}

.big:active,
.scan:active{
    transform:scale(.96);
}

/* السماعة */
.speaker{
    position:absolute;
    bottom:4%;
    left:18%;
    width:64%;
    height:25%;

    border-radius:45% 45% 35% 35%;

    background:
        radial-gradient(
            ellipse,
            #111 0%,
            #252729 65%,
            #111 100%
        );

    border:4px solid #555;

    box-shadow:
        inset 0 0 20px #000;
}

/* فتحات السماعة */
.holes{
    position:absolute;
    inset:12%;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    align-content:center;
}

.hole{
    height:9px;
    border-radius:10px;

    background:#08090a;

    box-shadow:
        inset 0 2px 3px #000,
        0 1px 1px #555;
}

.ptt{
    position:absolute;
    top:42%;
    left:0;
    width:100%;

    text-align:center;

    color:#fff;
    font-size:28px;
    font-weight:bold;

    text-shadow:0 2px 4px #000;
}
</style>
</head>

<body>

<div class="radio">

    <div class="antenna"></div>
    <div class="knob"></div>

    <button class="power">⏻</button>

    <div class="local">LOCAL</div>
    <div class="rp">RP</div>

    <div class="panel">

        <div class="icon">▤</div>

        <div class="display">
            <div class="number" id="number">001</div>
        </div>

        <div class="controls">

            <button class="control"
                    onclick="changeNumber(1)">
                +
            </button>

            <button class="control"
                    onclick="changeNumber(1)">
                M
            </button>

            <button class="control"
                    onclick="changeNumber(-1)">
                −
            </button>

        </div>

    </div>

    <div class="bottom">

        <button class="big"
                onclick="changeNumber(1)">
            UP
        </button>

        <button class="scan"
                onclick="scan()">
            SCAN
        </button>

        <button class="big"
                onclick="changeNumber(-1)">
            DN
        </button>

    </div>

    <div class="speaker">

        <div class="holes">

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

        </div>

        <div class="ptt">PTT</div>

    </div>

</div>

<script>

let number = 1;

function updateDisplay(){

    document.getElementById("number").textContent =
        String(number).padStart(3,"0");

}

function changeNumber(value){

    number += value;

    if(number > 999){
        number = 1;
    }

    if(number < 1){
        number = 999;
    }

    updateDisplay();

}

function scan(){

    let interval = setInterval(function(){

        number++;

        if(number > 999){
            number = 1;
        }

        updateDisplay();

    },100);

    setTimeout(function(){
        clearInterval(interval);
    },2000);

}

updateDisplay();

</script>

</body>
</html>
