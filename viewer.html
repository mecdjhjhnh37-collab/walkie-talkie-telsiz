<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المراقب - Camera Connect</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050709;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 25px 16px 40px;
      text-align: center;
    }

    h1 {
      font-size: 35px;
      margin: 15px 0 8px;
    }

    .subtitle {
      color: #8e9aa8;
      margin-bottom: 25px;
    }

    .scanner {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 25px;
      background: #000;
      border: 2px solid #2979ff;
    }

    #camera {
      display: block;
      width: 100%;
      height: 430px;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    .frame {
      position: absolute;
      width: 230px;
      height: 230px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid white;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(41,121,255,.6);
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      width: 190px;
      height: 3px;
      background: #2979ff;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      animation: scan 2s infinite;
      box-shadow: 0 0 15px #2979ff;
    }

    @keyframes scan {
      0% {
        transform: translate(-50%, -100px);
      }

      50% {
        transform: translate(-50%, 100px);
      }

      100% {
        transform: translate(-50%, -100px);
      }
    }

    .status {
      margin: 20px 0;
      padding: 16px;
      border-radius: 17px;
      background: rgba(41,121,255,.12);
      color: #73a9ff;
      line-height: 1.6;
    }

    #remoteVideo {
      display: none;
      width: 100%;
      height: 65vh;
      min-height: 350px;
      object-fit: cover;
      background: black;
      border-radius: 25px;
      border: 2px solid #00e676;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 17px;
      border: none;
      border-radius: 17px;
      background: #222;
      color: white;
      font-size: 17px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>👁️ المراقب</h1>

  <p class="subtitle">
    وجّه الكاميرا نحو QR الموجود على هاتف الكاميرا
  </p>

  <div id="scannerArea">

    <div class="scanner">

      <video
        id="camera"
        autoplay
        muted
        playsinline
      ></video>

      <div class="frame">
        <div class="scan-line"></div>
      </div>

    </div>

    <canvas id="canvas"></canvas>

    <div class="status" id="status">
      🟡 جاري تشغيل قارئ QR...
    </div>

  </div>

  <video
    id="remoteVideo"
    autoplay
    playsinline
  ></video>

  <button onclick="location.href='index.html'">
    العودة للرئيسية
  </button>

</div>


<script>

const camera = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

const statusBox = document.getElementById("status");
const scannerArea = document.getElementById("scannerArea");
const remoteVideo = document.getElementById("remoteVideo");

let cameraStream = null;
let peer = null;
let scanning = false;


/* =========================
   تشغيل Peer
========================= */

function startPeer() {

  peer = new Peer();

  peer.on("open", function(id) {

    console.log("Viewer ID:", id);

    startCamera();

  });

  peer.on("error", function(error) {

    console.error(error);

    statusBox.textContent =
      "🔴 حدث خطأ في الاتصال";

  });
}


/* =========================
   تشغيل الكاميرا
========================= */

async function startCamera() {

  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });


    camera.srcObject = cameraStream;

    await camera.play();

    statusBox.textContent =
      "🟢 وجّه الكاميرا نحو QR";

    scanning = true;

    scanQR();

  }

  catch(error) {

    console.error(error);

    statusBox.textContent =
      "🔴 لم نستطع تشغيل الكاميرا";

  }

}


/* =========================
   قراءة QR
========================= */

function scanQR() {

  if (!scanning) {
    return;
  }

  if (
    camera.readyState ===
    camera.HAVE_ENOUGH_DATA
  ) {

    const width = camera.videoWidth;
    const height = camera.videoHeight;

    if (width && height) {

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(
        camera,
        0,
        0,
        width,
        height
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          width,
          height
        );

      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (code) {

        console.log(
          "QR FOUND:",
          code.data
        );

        scanning = false;

        statusBox.textContent =
          "🟢 تم العثور على الكود! جاري الاتصال...";

        connectToCamera(code.data);

        return;
      }
    }
  }

  requestAnimationFrame(scanQR);
}


/* =========================
   الاتصال بالكاميرا
========================= */

function connectToCamera(cameraId) {

  try {

    const call =
      peer.call(
        cameraId,
        cameraStream
      );


    call.on("stream", function(remoteStream) {

      console.log(
        "REMOTE VIDEO RECEIVED"
      );

      remoteVideo.srcObject =
        remoteStream;

      remoteVideo.style.display =
        "block";

      scannerArea.style.display =
        "none";

      statusBox.textContent =
        "🟢 متصل — البث مباشر";

      remoteVideo.play().catch(
        error => console.log(error)
      );

    });


    call.on("close", function() {

      remoteVideo.style.display =
        "none";

      scannerArea.style.display =
        "block";

      statusBox.textContent =
        "🟡 تم إنهاء الاتصال";

      scanning = true;

      scanQR();

    });


    call.on("error", function(error) {

      console.error(error);

      statusBox.textContent =
        "🔴 فشل الاتصال بالكاميرا";

    });

  }

  catch(error) {

    console.error(error);

    statusBox.textContent =
      "🔴 حدث خطأ أثناء الاتصال";

  }

}


/* تشغيل */

startPeer();

</script>

</body>
</html>
