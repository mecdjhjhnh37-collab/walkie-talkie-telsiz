<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المراقب - Camera Connect</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050807;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 25px 18px 40px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin: 15px 0 8px;
    }

    .subtitle {
      color: #8e9995;
    }

    #reader {
      width: 100%;
      margin: 25px auto;
      overflow: hidden;
      border-radius: 25px;
    }

    #remoteVideo {
      display: none;
      width: 100%;
      height: 65vh;
      min-height: 350px;
      object-fit: cover;
      background: #000;
      border-radius: 25px;
      border: 2px solid #2979ff;
    }

    .status {
      margin: 20px 0;
      padding: 15px;
      border-radius: 15px;
      background: rgba(41,121,255,.12);
      color: #66a3ff;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 16px;
      background: #222;
      color: white;
      font-size: 17px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>👁️ المراقب</h1>

  <p class="subtitle">
    امسح QR الموجود على هاتف الكاميرا
  </p>

  <div id="reader"></div>

  <div class="status" id="status">
    🟡 جاري تجهيز الماسح...
  </div>

  <video
    id="remoteVideo"
    autoplay
    playsinline
    controls="false"
  ></video>

  <button onclick="location.href='index.html'">
    العودة للرئيسية
  </button>

</div>

<script>

const statusBox = document.getElementById("status");
const remoteVideo = document.getElementById("remoteVideo");

let peer;
let scanner;


/* إنشاء Peer للمراقب */
function startPeer() {

  peer = new Peer();

  peer.on("open", function() {

    statusBox.textContent =
      "🟢 جاهز — امسح QR الخاص بالكاميرا";

    startScanner();

  });

  peer.on("error", function(error) {

    console.error(error);

    statusBox.textContent =
      "🔴 حدث خطأ في الاتصال";

  });
}


/* تشغيل QR Scanner */
function startScanner() {

  scanner = new Html5Qrcode("reader");

  scanner.start(
    {
      facingMode: {
        ideal: "environment"
      }
    },
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    async function(decodedText) {

      console.log("QR:", decodedText);

      try {
        await scanner.stop();
      } catch (e) {}

      document.getElementById("reader").style.display =
        "none";

      connectToCamera(decodedText);

    },

    function(errorMessage) {
      // أخطاء المسح العادية نتجاهلها
    }

  ).catch(function(error) {

    console.error(error);

    statusBox.textContent =
      "🔴 لم نستطع تشغيل كاميرا الماسح";

  });
}


/* الاتصال بالكاميرا */
async function connectToCamera(cameraId) {

  statusBox.textContent =
    "🟡 جاري الاتصال بالكاميرا...";

  try {

    /*
      نطلب كاميرا + مايك للمراقب فقط
      من أجل إنشاء مسار فيديو في WebRTC.
      
      لن نعرض فيديو هذا الهاتف.
    */
    const viewerStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });


    const call =
      peer.call(cameraId, viewerStream);


    call.on("stream", function(remoteStream) {

      console.log("Remote stream received");

      remoteVideo.srcObject = remoteStream;

      remoteVideo.style.display = "block";

      statusBox.textContent =
        "🟢 متصل — البث مباشر";

      remoteVideo.play().catch(function(error) {
        console.log("Video play:", error);
      });

    });


    call.on("close", function() {

      statusBox.textContent =
        "🟡 تم إنهاء الاتصال";

      remoteVideo.style.display = "none";

    });


    call.on("error", function(error) {

      console.error(error);

      statusBox.textContent =
        "🔴 فشل اتصال الفيديو";

    });


  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "🔴 يجب السماح بالكاميرا والمايك لإتمام الاتصال";

  }

}


startPeer();

</script>

</body>
</html>
