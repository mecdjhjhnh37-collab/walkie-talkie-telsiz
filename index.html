<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geliştirici Mecid</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #101010;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 390px;
            text-align: center;
        }

        .logo {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 12px;
        }

        .subtitle {
            color: #999;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .language-title {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .language-subtitle {
            color: #999;
            margin-bottom: 30px;
        }

        .language-buttons {
            display: flex;
            gap: 12px;
        }

        .language-button {
            flex: 1;

            height: 55px;

            border: 1px solid #333;
            border-radius: 14px;

            background: #191919;
            color: white;

            font-size: 17px;

            cursor: pointer;
        }

        .language-button:hover {
            background: #252525;
        }

        .google-button {
            width: 100%;
            height: 55px;

            border: none;
            border-radius: 14px;

            background: white;
            color: #222;

            font-size: 16px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            cursor: pointer;
        }

        .google-button:active {
            transform: scale(0.98);
        }

        .google-icon {
            width: 22px;
            height: 22px;
        }

        #languagePage,
        #loginPage {
            width: 100%;
        }

        #loginPage {
            display: none;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }

        .back {
            margin-top: 25px;

            background: transparent;
            border: none;

            color: #888;

            cursor: pointer;

            font-size: 15px;
        }

    </style>
</head>

<body>

<div class="container">


    <!-- ========================= -->
    <!-- صفحة اختيار اللغة -->
    <!-- ========================= -->

    <div id="languagePage">

        <div class="logo">📻</div>

        <div class="language-title">
            اختر اللغة
        </div>

        <div class="language-subtitle">
            Dilinizi seçin
        </div>

        <div class="language-buttons">

            <button
                class="language-button"
                onclick="selectLanguage('ar')">

                العربية

            </button>


            <button
                class="language-button"
                onclick="selectLanguage('tr')">

                Türkçe

            </button>

        </div>

    </div>



    <!-- ========================= -->
    <!-- صفحة تسجيل الدخول -->
    <!-- ========================= -->

    <div id="loginPage">

        <div class="logo">📻</div>

        <h1 id="welcomeText"></h1>

        <div
            class="subtitle"
            id="loginText">
        </div>


        <button
            id="googleLogin"
            class="google-button">

            <svg
                class="google-icon"
                viewBox="0 0 24 24">

                <path
                    fill="#4285F4"
                    d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.44h3.14c1.84-1.7 2.92-4.2 2.92-7.4z"/>

                <path
                    fill="#34A853"
                    d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.74 9.74 0 0 0 12 21.5z"/>

                <path
                    fill="#FBBC05"
                    d="M6.54 13.59A5.86 5.86 0 0 1 6.23 12c0-.55.1-1.08.31-1.59V7.89H3.3A9.5 9.5 0 0 0 2.25 12c0 1.48.35 2.87 1.05 4.11l3.24-2.52z"/>

                <path
                    fill="#EA4335"
                    d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.45 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.39l3.24 2.52C7.31 8.1 9.46 6.38 12 6.38z"/>

            </svg>

            <span id="googleText"></span>

        </button>


        <div id="status"></div>


        <button
            class="back"
            onclick="backToLanguages()">

            ← تغيير اللغة / Dili değiştir

        </button>

    </div>

</div>



<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    /*
    ==========================================
    ضع Firebase Config الخاص بك هنا
    ==========================================
    */

    const firebaseConfig = {
    apiKey: "AIzaSyCcdi7DbtxOeKAqCoUfI8GfAs1_Wg1zP_E",
    authDomain: "telsiz-7f227.firebaseapp.com",
    projectId: "telsiz-7f227",
    storageBucket: "telsiz-7f227.firebasestorage.app",
    messagingSenderId: "373728948261",
    appId: "1:373728948261:web:c1fa0d4ba4d661aa558fcc"
};


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    const languagePage =
        document.getElementById("languagePage");

    const loginPage =
        document.getElementById("loginPage");

    const welcomeText =
        document.getElementById("welcomeText");

    const loginText =
        document.getElementById("loginText");

    const googleText =
        document.getElementById("googleText");

    const googleLogin =
        document.getElementById("googleLogin");

    const status =
        document.getElementById("status");


    /*
    ==========================================
    اختيار اللغة
    ==========================================
    */

    window.selectLanguage = function(language) {

        localStorage.setItem(
            "language",
            language
        );


        languagePage.style.display = "none";

        loginPage.style.display = "block";


        if (language === "tr") {

            document.documentElement.lang = "tr";

            document.documentElement.dir = "ltr";


            welcomeText.textContent =
                "Geliştirici Mecid'in sitesine hoş geldiniz";

            loginText.textContent =
                "Giriş yap";

            googleText.textContent =
                "Google ile giriş yapın";

        }


        else {

            document.documentElement.lang = "ar";

            document.documentElement.dir = "rtl";


            welcomeText.textContent =
                "مرحبًا بك في موقع المطور مجد";

            loginText.textContent =
                "تسجيل الدخول";

            googleText.textContent =
                "تسجيل الدخول باستخدام Google";

        }

    };


    /*
    ==========================================
    العودة لاختيار اللغة
    ==========================================
    */

    window.backToLanguages = function() {

        loginPage.style.display = "none";

        languagePage.style.display = "block";

        status.textContent = "";

    };


    /*
    ==========================================
    تسجيل الدخول بواسطة Google
    ==========================================
    */

    googleLogin.addEventListener(
        "click",
        async () => {

            try {

                const language =
                    localStorage.getItem("language") || "ar";


                if (language === "tr") {

                    status.textContent =
                        "⏳ Giriş yapılıyor...";

                } else {

                    status.textContent =
                        "⏳ جاري تسجيل الدخول...";

                }


                googleLogin.disabled = true;


                const result =
                    await signInWithPopup(
                        auth,
                        provider
                    );


                const user =
                    result.user;


                console.log(
                    "تم تسجيل الدخول:",
                    user
                );


                /*
                الانتقال إلى صفحة اللاسلكي
                */

                window.location.href =
                    "radio.html";


            }

            catch (error) {

                console.error(error);

                googleLogin.disabled = false;


                const language =
                    localStorage.getItem("language") || "ar";


                if (language === "tr") {

                    status.textContent =
                        "❌ Giriş yapılamadı";

                } else {

                    status.textContent =
                        "❌ فشل تسجيل الدخول";

                }

            }

        }
    );

</script>

</body>

</html>
