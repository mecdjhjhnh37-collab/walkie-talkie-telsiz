<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Connect</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>📷 Camera Connect</h1>

<div class="buttons">
    <button onclick="createRoom()">⬆️ إنشاء اقتران</button>
    <button onclick="scanRoom()">⬇️ مسح كود QR</button>
</div>

<div id="qrBox" class="box">
    <p>سيظهر كود QR هنا</p>
</div>

<div id="cameraBox" class="box">
    <video id="camera" autoplay playsinline></video>
</div>

<p id="status">الحالة: غير متصل</p>

</div>

<script src="app.js"></script>

</body>
</html>
