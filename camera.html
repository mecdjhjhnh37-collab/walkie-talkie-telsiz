<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="theme-color" content="#050807">

<title>الكاميرا - Camera Connect</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100dvh;
    background:#050807;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;
}

.app{
    width:100%;
    max-width:650px;
}

.card{
    background:#07110f;
    border:1px solid #12352c;
    border-radius:24px;
    padding:20px;
    box-shadow:0 15px 50px rgba(0,0,0,.45);
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:#8aa59c;
    font-size:14px;
    margin-bottom:18px;
}

.video-box{
    width:100%;
    aspect-ratio:16/9;
    background:#020504;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #163d32;
    margin-bottom:18px;
}

#localVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.info{
    background:#020908;
    border:1px solid #12352c;
    border-radius:18px;
    padding:16px;
    text-align:center;
}

.label{
    color:#8aa59c;
    font-size:13px;
    margin-bottom:7px;
}

.code{
    direction:ltr;
    font-size:28px;
    font-weight:bold;
    letter-spacing:5px;
    color:#00e889;
    word-break:break-all;
    margin-bottom:15px;
}

.status{
    min-height:24px;
    color:#b8ccc5;
    font-size:14px;
}

.qr{
    width:220px;
    height:220px;
    margin:18px auto;
    padding:10px;
    background:#fff;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.qr img,
.qr canvas{
    max-width:100%;
    max-height:100%;
}

.buttons{
    display:grid;
    gap:10px;
    margin-top:15px;
}

button{
    width:100%;
    border:0;
    border-radius:15px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.end{
    background:#00e889;
    color:#00140d;
}

.home{
    background:#10221d;
    color:#fff;
    border:1px solid #19473a;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.note{
    text-align:center;
    color:#6f8981;
    font-size:12px;
    margin-top:14px;
    line-height:1.6;
}

.error{
    color:#ff7777;
}

.success{
    color:#00e889;
}

@media(max-width:400px){
    .card{
        padding:15px;
        border-radius:20px;
    }

    .code{
        font-size:23px;
        letter-spacing:3px;
    }

    .qr{
        width:200px;
        height:200px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="card">

        <h1>📷 Camera Connect</h1>

        <div class="subtitle">
            الكاميرا
        </div>

        <div class="video-box">
            <video
                id="localVideo"
                autoplay
                muted
                playsinline>
            </video>
        </div>

        <div class="info">

            <div class="label">
                كود الكاميرا
            </div>

            <div id="cameraCode" class="code">
                ------
            </div>

            <div id="qr" class="qr"></div>

            <div id="status" class="status">
                جاري تشغيل الكاميرا...
            </div>

        </div>

        <div class="buttons">

            <button
                id="endBtn"
                class="end"
                disabled>
                ⛔ إنهاء البث
            </button>

            <button
                class="home"
                onclick="goHome()">
                🏠 الرئيسية
            </button>

        </div>

        <div class="note">
            يمكن للمراقب مسح QR أو إدخال كود الكاميرا يدويًا.
        </div>

    </div>

</div>

<script>

"use strict";

let localStream = null;
let peer = null;
let activeCalls = new Set();
let stopped = false;

const localVideo = document.getElementById("localVideo");
const cameraCode = document.getElementById("cameraCode");
const qr = document.getElementById("qr");
const statusEl = document.getElementById("status");
const endBtn = document.getElementById("endBtn");


/* =========================
   توليد كود قصير
========================= */

function generateCameraCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for(let i = 0; i < 6; i++){
        code += chars[
            Math.floor(Math.random() * chars.length)
        ];
    }

    return code;
}


/* =========================
   الحالة
========================= */

function setStatus(text,type=""){

    statusEl.textContent = text;

    statusEl.className = "status";

    if(type){
        statusEl.classList.add(type);
    }
}


/* =========================
   تشغيل الكاميرا
========================= */

async function startCamera(){

    try{

        setStatus("جاري طلب إذن الكاميرا...");

        localStream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },
                width:{
                    ideal:1280
                },
                height:{
                    ideal:720
                }
            },

            audio:true

        });

        localVideo.srcObject = localStream;

        try{
            await localVideo.play();
        }catch(e){}

        setStatus(
            "الكاميرا تعمل — بانتظار المراقب",
            "success"
        );

        endBtn.disabled = false;

        createPeer();

    }catch(error){

        console.error(error);

        setStatus(
            "تعذر تشغيل الكاميرا. تأكد من إعطاء الإذن للكاميرا والميكروفون.",
            "error"
        );

    }

}


/* =========================
   إنشاء Peer بكود قصير
========================= */

function createPeer(){

    if(stopped) return;

    const id = generateCameraCode();

    setStatus("جاري إنشاء كود الكاميرا...");

    peer = new Peer(id);

    peer.on("open",(openedId)=>{

        console.log("Camera Peer ID:",openedId);

        cameraCode.textContent = openedId;

        createQRCode(openedId);

        setStatus(
            "الكاميرا جاهزة — امسح QR أو أدخل الكود",
            "success"
        );

    });


    /* =========================
       اتصال مراقب بالكاميرا
    ========================= */

    peer.on("call",(call)=>{

        if(stopped || !localStream){

            try{
                call.close();
            }catch(e){}

            return;
        }

        console.log("Incoming viewer:",call.peer);

        try{

            call.answer(localStream);

            activeCalls.add(call);

            call.on("close",()=>{

                activeCalls.delete(call);

                if(!stopped){

                    setStatus(
                        "انتهى اتصال المراقب — بانتظار مراقب آخر",
                        "success"
                    );

                }

            });

            call.on("error",(error)=>{

                console.error("Call error:",error);

                activeCalls.delete(call);

            });

            setStatus(
                "🟢 يوجد مراقب متصل الآن",
                "success"
            );

        }catch(error){

            console.error(error);

        }

    });


    /* =========================
       Peer Errors
    ========================= */

    peer.on("error",(error)=>{

        console.error("Peer error:",error);

        if(stopped) return;

        if(error.type === "unavailable-id"){

            try{
                peer.destroy();
            }catch(e){}

            peer = null;

            setTimeout(()=>{

                if(!stopped){
                    createPeer();
                }

            },300);

            return;
        }

        if(error.type === "network"){

            setStatus(
                "مشكلة في الاتصال بالشبكة...",
                "error"
            );

            return;
        }

        setStatus(
            "حدث خطأ في الاتصال",
            "error"
        );

    });


    peer.on("disconnected",()=>{

        if(stopped) return;

        setStatus(
            "انقطع اتصال الخادم، جاري إعادة الاتصال...",
            "error"
        );

        try{
            peer.reconnect();
        }catch(e){}

    });

}


/* =========================
   إنشاء QR
========================= */

function createQRCode(code){

    qr.innerHTML = "";

    try{

        new QRCode(qr,{

            text:code,

            width:200,
            height:200,

            correctLevel:QRCode.CorrectLevel.M

        });

    }catch(error){

        console.error(error);

        setStatus(
            "تعذر إنشاء QR",
            "error"
        );

    }

}


/* =========================
   إنهاء البث
========================= */

function endBroadcast(){

    if(stopped) return;

    stopped = true;

    activeCalls.forEach(call=>{

        try{
            call.close();
        }catch(e){}

    });

    activeCalls.clear();

    if(localStream){

        localStream.getTracks().forEach(track=>{

            try{
                track.stop();
            }catch(e){}

        });

        localStream = null;
    }

    localVideo.srcObject = null;

    if(peer){

        try{
            peer.destroy();
        }catch(e){}

        peer = null;
    }

    cameraCode.textContent = "------";

    qr.innerHTML = "";

    endBtn.disabled = true;

    setStatus(
        "تم إنهاء البث"
    );

}


/* =========================
   الرئيسية
========================= */

function goHome(){

    endBroadcast();

    setTimeout(()=>{

        if(history.length > 1){
            history.back();
        }else{
            location.href = "./";
        }

    },100);

}


/* =========================
   زر الإنهاء
========================= */

endBtn.addEventListener(
    "click",
    endBroadcast
);


/* =========================
   تنظيف عند الخروج
========================= */

window.addEventListener(
    "pagehide",
    ()=>{
        if(!stopped){
            endBroadcast();
        }
    }
);


/* =========================
   البداية
========================= */

startCamera();

</script>

</body>
</html>
