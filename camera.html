<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الكاميرا - Camera Connect</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050807;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 25px 18px 40px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin: 15px 0 8px;
    }

    .subtitle {
      color: #8e9995;
      margin-bottom: 25px;
    }

    video {
      display: block;
      width: 100%;
      height: 55vh;
      min-height: 300px;
      object-fit: cover;
      background: #111;
      border-radius: 25px;
      border: 2px solid #00e676;
    }

    .card {
      margin-top: 22px;
      padding: 22px;
      border-radius: 25px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
    }

    #qrcode {
      width: 220px;
      height: 220px;
      margin: 20px auto;
      padding: 10px;
      background: white;
      border-radius: 15px;
    }

    #qrcode img {
      width: 200px !important;
      height: 200px !important;
    }

    .code {
      direction: ltr;
      word-break: break-all;
      color: #00e676;
      font-size: 12px;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 15px;
      background: rgba(0,230,118,.1);
      color: #00e676;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 16px;
      background: #222;
      color: white;
      font-size: 17px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>📷 الكاميرا</h1>

  <p class="subtitle">
    هذا الهاتف هو الكاميرا
  </p>

  <video
    id="localVideo"
    autoplay
    muted
    playsinline
  ></video>

  <div class="card">

    <h2>📱 امسح هذا الكود من الهاتف الآخر</h2>

    <div id="qrcode"></div>

    <div class="code" id="peerId">
      جاري إنشاء الكود...
    </div>

    <div class="status" id="status">
      🟡 جاري تشغيل الكاميرا...
    </div>

  </div>

  <button onclick="location.href='index.html'">
    العودة للرئيسية
  </button>

</div>

<script>

const video = document.getElementById("localVideo");
const statusBox = document.getElementById("status");
const peerIdBox = document.getElementById("peerId");

let localStream = null;
let peer = null;


/* تشغيل الكاميرا */
async function startCamera() {

  try {

    localStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment",
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        }
      },
      audio: true
    });

    const videoTrack = localStream.getVideoTracks()[0];

    if (!videoTrack) {
      throw new Error("لم يتم الحصول على مسار الفيديو");
    }

    videoTrack.enabled = true;

    video.srcObject = localStream;

    try {
      await video.play();
    } catch (e) {
      console.log("Autoplay:", e);
    }

    statusBox.textContent =
      "🟢 الكاميرا تعمل — جاري إنشاء كود الاتصال";

    createPeer();

  } catch (error) {

    console.error("Camera error:", error);

    statusBox.textContent =
      "🔴 لم نستطع تشغيل الكاميرا. تأكد من إعطاء إذن الكاميرا والمايك.";

  }
}


/* إنشاء Peer */
function createPeer() {

  peer = new Peer();

  peer.on("open", function(id) {

    peerIdBox.textContent = id;

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(document.getElementById("qrcode"), {
      text: id,
      width: 200,
      height: 200
    });

    statusBox.textContent =
      "🟢 جاهز — انتظر اتصال المراقب";

  });


  /* عندما يتصل المراقب */
  peer.on("call", function(call) {

    console.log("Incoming call");

    statusBox.textContent =
      "🔵 المراقب يتصل...";

    call.answer(localStream);

    call.on("close", function() {

      statusBox.textContent =
        "🟢 الكاميرا تعمل — بانتظار المراقب";

    });

  });


  peer.on("error", function(error) {

    console.error("Peer error:", error);

    statusBox.textContent =
      "🔴 حدث خطأ في الاتصال";

  });

}


startCamera();

</script>

</body>
</html>
